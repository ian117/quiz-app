name: quiz-app

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quiz}
      POSTGRES_DB: ${POSTGRES_DB:-quiz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Solo en localhost: lo usan los tests de integración del backend desde el host.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Job de un solo uso: migra el esquema, sincroniza el quiz y termina.
  # El quiz vive en el repo privado ment-it-questions (carpeta hermana), no en este repo público.
  # La misma imagen servirá para la api (otro comando).
  sync:
    image: quiz-app-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli.sync"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quiz}:${POSTGRES_PASSWORD:-quiz}@db:5432/${POSTGRES_DB:-quiz}
      QUIZ_DIR: /quiz
    volumes:
      - ${QUIZ_HOST_DIR:-../ment-it-questions/quiz}:/quiz:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: quiz-app-backend
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quiz}:${POSTGRES_PASSWORD:-quiz}@db:5432/${POSTGRES_DB:-quiz}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    # Solo en localhost: lo consume el frontend desde el navegador.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      # python:slim no trae curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      # Con `sync` terminado bien, el esquema está migrado y el quiz cargado.
      sync:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    # Solo en localhost; el puerto 5173 es el que permite CORS por defecto.
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Guarda también el historial de sesiones, que no se puede reconstruir desde el quiz.
  # Nombre fijo para que renombrar la carpeta del proyecto no deje el volumen huérfano.
  # No uses `docker compose down -v` sin respaldo.
  pgdata:
    name: quiz-app-pgdata
